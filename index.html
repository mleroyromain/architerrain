<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#111827">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon.svg">
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
<title>ArchiTerrain V1.6</title>
<style>
:root{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;color:#111827;background:#f4f5f7}
*{box-sizing:border-box}body{margin:0}header{padding:20px 18px;background:#111827;color:#fff}.brand{font-size:28px;font-weight:800}.sub{opacity:.75}
main{max-width:860px;margin:auto;padding:16px}.card{background:#fff;border-radius:18px;padding:18px;margin:14px 0;box-shadow:0 2px 12px #0001}
input,button{width:100%;padding:14px;border-radius:12px;font-size:16px;margin:7px 0}input{border:1px solid #d1d5db;background:#fff}
button{border:0;background:#111827;color:#fff;font-weight:700}button.secondary{background:#e5e7eb;color:#111827}
.small{font-size:13px;color:#6b7280}.title{font-weight:750}.item{padding:14px 0;border-top:1px solid #eee}
.row{display:flex;justify-content:space-between;gap:12px;align-items:center}.badge{padding:6px 9px;border-radius:999px;font-size:12px;font-weight:700;white-space:nowrap}
.ok{background:#dcfce7;color:#166534}.warn{background:#fef3c7;color:#92400e}.danger{background:#fee2e2;color:#991b1b}
.error{background:#fee2e2;color:#991b1b;padding:12px;border-radius:12px}.success{background:#dcfce7;color:#166534;padding:12px;border-radius:12px}
#loading{display:none;text-align:center;padding:15px}#map{height:360px;width:100%;border-radius:14px;overflow:hidden;margin-top:14px}
.leaflet-container{font:inherit}.parcelChoice{border:1px solid #e5e7eb;border-radius:12px;padding:12px;margin:8px 0}
.parcelChoice.selected{border:2px solid #2563eb;background:#eff6ff}.parcelChoice label{display:flex;gap:12px;align-items:flex-start}
.parcelChoice input[type=checkbox]{width:22px;height:22px;margin:2px 0;flex:none}
.legend{display:flex;gap:10px;flex-wrap:wrap;margin-top:10px}.legend span{font-size:12px}
.stat{display:grid;grid-template-columns:1fr 1fr;gap:10px}.stat>div{background:#f8fafc;border-radius:12px;padding:12px}.stat b{display:block;font-size:20px}
.rule{background:#f8fafc;border-radius:14px;padding:14px;margin:10px 0;border-left:4px solid #d1d5db}
.rule-head{display:flex;justify-content:space-between;gap:10px;align-items:flex-start}.rule-title{font-size:16px;font-weight:800}.rule-value{font-size:20px;font-weight:800;margin:7px 0}
.rule-detail{font-size:14px;line-height:1.45}.source{font-size:12px;color:#6b7280;margin-top:8px}.chips{display:flex;gap:6px;flex-wrap:wrap;margin:8px 0}.mini{background:#eef2ff;color:#3730a3;border-radius:999px;padding:5px 8px;font-size:12px}.evidence{margin-top:12px;padding:12px;border-radius:12px;background:#fff;border:1px solid #e5e7eb}.diagram{background:#f8fafc;border:1px solid #e5e7eb;border-radius:14px;padding:10px;margin-top:12px}.metric{display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px}.metric div{background:#fff;border-radius:10px;padding:10px}.metric b{display:block;font-size:18px}.alertbox{padding:12px;border-radius:12px;margin:8px 0}.alertbox.red{background:#fee2e2;color:#991b1b}.alertbox.orange{background:#ffedd5;color:#9a3412}.alertbox.green{background:#dcfce7;color:#166534}.missing{margin-top:8px;padding:9px;border-radius:9px;background:#fff7ed;color:#9a3412;font-size:13px}
details{margin-top:8px}summary{color:#2563eb;font-size:13px;cursor:pointer}
a{color:#2563eb;text-decoration:none}
</style>
</head>
<body>
<header><div class="brand">ArchiTerrain</div><div class="sub">Pré-diagnostic urbanistique · V3.3</div></header>
<main>
<section class="card">
<div class="title">Analyser un terrain</div>
<div class="small">Une adresse, une parcelle ou plusieurs parcelles</div>
<input id="address" value="28 boulevard André, 93250 Villemomble" placeholder="Ex. 28 boulevard André, Villemomble">
<input id="parcelRef" placeholder="Optionnel : AQ 61, AQ 62, AQ 63">
<button onclick="analyze()">Rechercher le terrain</button>
<div id="loading">⏳ Recherche des parcelles…</div>
</section>
<div id="result"></div>
</main>
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@turf/turf@7/turf.min.js"></script>
<script>
const CARTO="https://apicarto.ign.fr/api", BAN="https://api-adresse.data.gouv.fr/search/";
let state={addressFeature:null,candidates:[],selected:[],map:null};

async function json(url){const r=await fetch(url);if(!r.ok)throw new Error("Service indisponible ("+r.status+")");return r.json()}
function esc(v){return String(v??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]))}
function badge(s){return `<span class="badge ${s}">${s==="ok"?"Vérifié":s==="danger"?"Contrainte":"À vérifier"}</span>`}
function pick(p,keys){for(const k of keys)if(p?.[k]!==undefined&&p[k]!==null&&p[k]!=="")return p[k];return null}
function parcelLabel(f){
 const p=f.properties||{};
 let section=pick(p,["section","section_cadastrale","code_section","section_parcelle"]);
 let numero=pick(p,["numero","numero_parcelle","num_parcelle","code_parcelle"]);
 if(!section) for(const k of Object.keys(p)){if(/section/i.test(k)&&p[k]){section=p[k];break}}
 if(!numero) for(const k of Object.keys(p)){if(/numero|num.*parc/i.test(k)&&p[k]){numero=p[k];break}}
 if(section||numero)return `${section||"—"} ${String(numero||"—").replace(/^0+/,"")||"0"}`;
 return p.id_parcelle||p.id||"Parcelle";
}
function area(f){const p=f.properties||{},n=pick(p,["contenance","surface"]);return n?Number(n):0}
function labels(fc){return [...new Set((fc?.features||[]).map(f=>pick(f.properties,["libelle","libelle_zone","libelle_long","nom","nom_zone","typezone","libelle_acte","categorie","libelle_sup","id"])).filter(Boolean))]}
function coordsOf(f){let pts=[];function walk(x){if(typeof x[0]==="number")pts.push(x);else x.forEach(walk)}walk(f.geometry.coordinates);return pts.length?pts.reduce((a,p)=>[a[0]+p[0]/pts.length,a[1]+p[1]/pts.length],[0,0]):null}
function dist2(a,b){return (a[0]-b[0])**2+(a[1]-b[1])**2}
function bboxAround([lon,lat],d=.0005){return {type:"Polygon",coordinates:[[[lon-d,lat-d],[lon+d,lat-d],[lon+d,lat+d],[lon-d,lat+d],[lon-d,lat-d]]]}}
async function geocode(q){const j=await json(BAN+"?q="+encodeURIComponent(q)+"&limit=5");if(!j.features?.length)throw new Error("Adresse introuvable.");return j.features}
async function parcelQuery(geom){const j=await json(CARTO+"/cadastre/parcelle?geom="+encodeURIComponent(JSON.stringify(geom))+"&source_ign=PCI");return j.features||[]}
async function refQuery(insee,section,number){const qs=new URLSearchParams({code_insee:insee,section:section.toUpperCase(),numero:number.padStart(4,"0"),source_ign:"PCI"});const j=await json(CARTO+"/cadastre/parcelle?"+qs);return j.features||[]}
async function gpu(path,geom){try{return await json(CARTO+"/gpu/"+path+"?geom="+encodeURIComponent(JSON.stringify(geom)))}catch(e){return {features:[],error:e.message}}}

async function findCandidates(adr,refs){
 const coords=adr.geometry.coordinates;
 if(refs.length){
   const found=[]; for(const ref of refs){const m=ref.trim().match(/^([A-Za-z]{1,3})\s*(\d{1,4})$/);if(!m)continue;found.push(...await refQuery(adr.properties.citycode,m[1],m[2]))}
   if(found.length)return found; throw new Error("Aucune des références cadastrales saisies n'a été trouvée dans la commune.");
 }
 let fs=await parcelQuery({type:"Point",coordinates:coords}); if(fs.length)return fs;
 fs=await parcelQuery(bboxAround(coords)); if(!fs.length)throw new Error("Aucune parcelle trouvée autour de cette adresse.");
 return fs.map(f=>({f,c:coordsOf(f)})).filter(x=>x.c).sort((a,b)=>dist2(a.c,coords)-dist2(b.c,coords)).map(x=>x.f);
}
function showCandidates(adr,fs){
 state.addressFeature=adr;state.candidates=fs;state.selected=fs.length===1?[0]:[];
 const choices=fs.slice(0,20).map((f,i)=>{const a=area(f),sel=state.selected.includes(i);return `<div class="parcelChoice ${sel?"selected":""}"><label><input type="checkbox" ${sel?"checked":""} onchange="toggleParcel(${i},this.checked)"><span><b>${esc(parcelLabel(f))}</b><br><span class="small">${a?Math.round(a)+" m²":"surface non fournie"} · parcelle cadastrale</span></span></label></div>`}).join("");
 document.getElementById("result").innerHTML=`<section class="card"><div class="title">Parcelles candidates</div><p>${esc(adr.properties.label||"Adresse")}</p><div class="small">Sélectionne une ou plusieurs parcelles appartenant au projet. Elles resteront détaillées individuellement dans le diagnostic.</div>${choices}<button onclick="analyzeSelected()">Analyser ${state.selected.length} parcelle${state.selected.length>1?"s":""}</button></section>`;
}
function toggleParcel(i,checked){if(checked&&!state.selected.includes(i))state.selected.push(i);if(!checked)state.selected=state.selected.filter(x=>x!==i);showCandidatesKeep()}
function showCandidatesKeep(){document.querySelectorAll('.parcelChoice input').forEach((b,i)=>b.checked=state.selected.includes(i));document.querySelectorAll('.parcelChoice').forEach((el,i)=>el.classList.toggle('selected',state.selected.includes(i)));const btn=document.querySelector('#result button');if(btn)btn.textContent=`Analyser ${state.selected.length} parcelle${state.selected.length>1?"s":""}`}
function unionSelected(){const fs=state.selected.map(i=>state.candidates[i]);if(fs.length===1)return fs[0];const u=turf.union(turf.featureCollection(fs));if(!u)throw new Error("Impossible de construire l'emprise cumulée.");return u}

function normText(s){return String(s||"").normalize("NFD").replace(/[\u0300-\u036f]/g,"").toLowerCase()}
function clean(v){return String(v??"").replace(/_/g," ").replace(/\s+/g," ").trim()}
function attrs(p){
 const out=[];
 for(let i=1;i<=5;i++){const a=p["lib_attr"+i],v=p["lib_val"+i];if(a&&v)out.push({a:clean(a),v:clean(v)})}
 return out;
}
function firstAttr(p,tests){
 const aa=attrs(p);
 for(const t of tests){const x=aa.find(o=>normText(o.a).includes(normText(t)));if(x)return x.v}
 return null;
}
function typeCode(p){return `${String(p.typepsc??"").padStart(2,"0")}-${String(p.stypepsc??"").padStart(2,"0")}`}
function textOf(p){return [p.libelle,p.txt,p.nature,p.categorie,p.typepsc,p.stypepsc].filter(Boolean).join(" · ")}
function detectBoundary(text){
 const n=normText(text);
 if(n.includes("limite de fond")||n.includes("fond de parcelle")||n.includes("fond de terrain")) return "limite de fond de parcelle";
 if(n.includes("limite separative")||n.includes("limites separatives")) return "limites séparatives";
 if(n.includes("voie")||n.includes("emprise publique")||n.includes("alignement")) return "voie / emprise publique";
 return null;
}
function detectView(text){
 const n=normText(text);
 if(n.includes("vue droite")||n.includes("vues droites")||n.includes("vue directe")) return "avec vue(s) droite(s)";
 if(n.includes("vue oblique")||n.includes("vues obliques")) return "avec vue(s) oblique(s)";
 if(n.includes("baie")||n.includes("baies")||n.includes("jour")) return "avec baie(s) / ouverture(s)";
 if(n.includes("mur aveugle")||n.includes("sans baie")||n.includes("façade aveugle")) return "sans baie / façade aveugle";
 return null;
}
function detectQualifier(text){
 const n=normText(text);
 if(n.includes("sans vue")||n.includes("sans vues")||n.includes("sans baie")||n.includes("aveugle")) return "sans vue / sans baie";
 if(n.includes("avec vue")||n.includes("avec vues")||n.includes("vue droite")||n.includes("vue oblique")) return detectView(text);
 return null;
}
function extractDistance(text){
 const m=String(text||"").match(/(\d+(?:[.,]\d+)?)\s*(m|metres?|mètres?)\b/i);
 return m?m[1].replace(",",".")+" m":null;
}
function extractPercent(text){
 const m=String(text||"").match(/(\d+(?:[.,]\d+)?)\s*%/);return m?m[1].replace(",",".")+" %":null;
}
function extractNumber(text){
 const m=String(text||"").match(/\b(\d+(?:[.,]\d+)?)\b/);return m?m[1].replace(",","."):null;
}
function ruleId(parts){return parts.map(x=>normText(x||"")).join("|")}
function sourceInfo(p){
 const url=p.urlfic||p.URLFIC||null;
 const file=p.nomfic||p.NOMFIC||null;
 return {url,file,code:typeCode(p)};
}
function ruleFromFeature(f, parcelLabels){
 const p=f.properties||{}, raw=textOf(p), n=normText(raw), src=sourceInfo(p), attrs0=attrs(p);
 const code=typeCode(p), distance=extractDistance(raw), percent=extractPercent(raw);
 let category="autres",icon="📄",title="Prescription",subject="Règle réglementaire",boundary=null,condition=null,value=null,unit=null,confidence="À CONFIRMER",why="",qualifier=null;
 const hasMin=/\bminimum\b|\bminimale?\b|\bau moins\b/.test(n);
 const hasMax=/\bmaximum\b|\bmaximale?\b|\bau plus\b/.test(n);
 const view=detectView(raw);
 // CNIG codes are authoritative for the object of a prescription.
 if(code==="15-01"){
   category="implantation"; icon="📍"; title="Implantation — voie / emprise publique";
   subject="Distance par rapport à la voie / emprise publique"; boundary="voie / emprise publique";
   value=distance||firstAttr(p,["VALEUR_DE_RECUL","DISTANCE","RETRAIT","RECUL"]); unit=value?"m":null;
   qualifier=hasMin?"minimum":hasMax?"maximum":null;
   condition=view||detectQualifier(raw);
   why=value?`La prescription graphique fixe ${value}${qualifier?" "+qualifier:""} par rapport à la voie ou à l’emprise publique.`:"La distance est indiquée par le texte de la prescription mais sa valeur n’a pas été extraite.";
   confidence=value?"CERTIFIÉ":"À CONFIRMER";
 } else if(code==="15-02"){
   category="implantation"; icon="↔️"; title="Implantation — limite séparative latérale";
   subject="Distance par rapport aux limites séparatives latérales"; boundary="limites séparatives latérales";
   value=distance||firstAttr(p,["VALEUR_DE_RECUL","DISTANCE","RETRAIT","RECUL"]); unit=value?"m":null;
   qualifier=hasMin?"minimum":hasMax?"maximum":null; condition=view||detectQualifier(raw);
   why=value?`Distance ${qualifier||"prescrite"} depuis la limite séparative latérale.`:"Distance non extraite.";
   confidence=value?"CERTIFIÉ":"À CONFIRMER";
 } else if(code==="15-03"){
   category="implantation"; icon="🔚"; title="Implantation — fond de parcelle";
   subject="Distance par rapport aux limites de fond de parcelle"; boundary="limites des fonds de parcelles";
   value=distance||firstAttr(p,["VALEUR_DE_RECUL","DISTANCE","RETRAIT","RECUL"]); unit=value?"m":null;
   qualifier=hasMin?"minimum":hasMax?"maximum":null; condition=view||detectQualifier(raw);
   why=value?`Distance ${qualifier||"prescrite"} depuis le fond de parcelle.`:"Distance non extraite.";
   confidence=value?"CERTIFIÉ":"À CONFIRMER";
 } else if(code==="15-98"){
   category="implantation"; icon="🔀"; title="Implantation alternative";
   subject="Règle d’implantation alternative"; value=distance||firstAttr(p,["DISTANCE","RETRAIT","RECUL"]); unit=value?"m":null;
   qualifier=hasMin?"minimum":hasMax?"maximum":null; condition=view||detectQualifier(raw);
   why="Cas alternatif : les conditions d’application doivent être lues dans le règlement.";
   confidence=value?"À CONFIRMER":"À CONFIRMER";
 } else if(code==="15-00"){
   // Generic 15-00 is not displayed when a specific 15-01/02/03 exists.
   category="implantation"; icon="📍"; title="Implantation — règle générale"; subject="Règle générale d’implantation";
   value=distance||firstAttr(p,["VALEUR_DE_RECUL","DISTANCE","RETRAIT","RECUL"]); unit=value?"m":null;
   qualifier=hasMin?"minimum":hasMax?"maximum":null; condition=view||detectQualifier(raw);
   why="Règle générale : la limite exacte doit être confirmée par le règlement.";
   confidence=value?"À CONFIRMER":"À CONFIRMER";
 } else if(code==="38-01"||code==="38-02"||code==="38-00"||n.includes("emprise au sol")){
   category="emprise";icon="📐";title=code==="38-01"?"Emprise au sol minimale":code==="38-02"?"Emprise au sol maximale":"Emprise au sol";
   subject=title; value=percent||firstAttr(p,["COEF_EMPRISE_SOL_MIN","COEF_EMPRISE_SOL_MAX","COEF_EMPRISE_SOL"]); unit=value?"%":null;
   qualifier=code==="38-01"||hasMin?"minimum":code==="38-02"||hasMax?"maximum":null;
   why="Coefficient à appliquer à l’assiette foncière définie par le règlement."; confidence=value?"CERTIFIÉ":"À CONFIRMER";
 } else if(code==="39-01"||code==="39-02"||code==="39-00"||n.includes("hauteur")){
   category="hauteur";icon="↕️";title=code==="39-01"?"Hauteur minimale":code==="39-02"?"Hauteur maximale":"Hauteur";
   subject=title; value=distance||firstAttr(p,["HAUTEUR_METRES_MIN","HAUTEUR_METRES_MAX","HAUTEUR"]); unit=value?"m":null;
   qualifier=code==="39-01"||hasMin?"minimum":code==="39-02"||hasMax?"maximum":null;
   why="Valeur de hauteur identifiée. Le mode de mesure et les exceptions doivent être rattachés à l’article."; confidence=value?"CERTIFIÉ":"À CONFIRMER";
 } else if(code==="42-00"||n.includes("coefficient de biotope")||n.includes("biotope")){
   category="espaces";icon="🌿";title="Coefficient de biotope";
   subject="Coefficient de biotope"; value=percent||firstAttr(p,["COEF_BIOTOPE_MIN","COEF_BIOTOPE_MAX","COEF2_BIOTOPE_MIN","COEF2_BIOTOPE_MAX"]); unit=value?"%":null;
   qualifier=hasMin?"minimum":hasMax?"maximum":null; why="Valeur de biotope identifiée ; la définition des surfaces comptabilisables doit être vérifiée."; confidence=value?"CERTIFIÉ":"À CONFIRMER";
 } else if(code==="43-01"||code==="43-02"||code==="43-03"||n.includes("pleine terre")||n.includes("espace vert")||n.includes("vegetal")){
   category="espaces";icon="🌿";title=code==="43-03"?"Plantations":"Espaces libres / pleine terre";
   subject=title; value=percent||firstAttr(p,["POURCENTAGE","SURFACE","COEF"]); unit=value&&/%/.test(value)?"%":null;
   qualifier=hasMin?"minimum":hasMax?"maximum":null; why="La règle concerne les espaces non bâtis, plantations ou surfaces végétalisées ; la définition précise reste celle du règlement."; confidence=value?"CERTIFIÉ":"À CONFIRMER";
 } else if(code==="44-01"||code==="44-02"||code==="44-03"||n.includes("stationnement")){
   category="stationnement";icon="🚗";title=code==="44-01"?"Stationnement minimal":code==="44-02"?"Stationnement maximal":code==="44-03"?"Caractéristiques du stationnement":"Stationnement";
   subject=title; value=firstAttr(p,["NOMBRE","PLACES","MIN","MAX"])||extractNumber(raw); qualifier=code==="44-01"?"minimum":code==="44-02"?"maximum":hasMin?"minimum":hasMax?"maximum":null;
   why="La règle doit être reliée à la destination et à l’unité de calcul (logement, m², etc.)."; confidence=value?"À CONFIRMER":"À CONFIRMER";
 } else if(code.startsWith("41-")||n.includes("aspect")||n.includes("toiture")||n.includes("facade")){
   category="aspect";icon="🏠";title=code==="41-02"?"Aspect extérieur — toitures":code==="41-03"?"Aspect extérieur — clôtures":code==="41-01"?"Aspect extérieur — façades":"Aspect extérieur";subject=title;
   why="Prescription qualitative à lire dans le règlement."; confidence="À CONFIRMER";
 } else if(code==="28-00"||n.includes("acces")||n.includes("voirie")){
   category="acces";icon="🚪";title="Accès / voirie";subject=title;why="Prescription de desserte à lire dans le règlement.";confidence="À CONFIRMER";
 } else {
   subject=p.libelle||p.nature||"Autre prescription";
 }
 const applicability=parcelLabels?.length?parcelLabels.join(", "):"Parcelle(s) sélectionnée(s)";
 const key=ruleId([code,category,subject,boundary,condition,value,qualifier,applicability]);
 return {key,category,icon,title,subject,boundary,condition,value,unit,confidence,why,qualifier,raw,attrs:attrs0,src,applicability,code};
}
function confidenceBadge(c){
 if(c==="CERTIFIÉ")return `<span class="badge ok">🟢 Certifié</span>`;
 if(c==="À CONFIRMER")return `<span class="badge warn">🟡 À confirmer</span>`;
 return `<span class="badge danger">🔴 Non déterminé</span>`;
}
function ruleCard(r){
 const meta=[];
 if(r.boundary)meta.push(`<span class="mini">📍 ${esc(r.boundary)}</span>`);
 if(r.condition)meta.push(`<span class="mini">👁️ ${esc(r.condition)}</span>`);
 if(r.applicability)meta.push(`<span class="mini">Parcelle(s) : ${esc(r.applicability)}</span>`);
 return `<div class="rule">
  <div class="rule-head"><div class="rule-title">${r.icon} ${esc(r.subject)}</div>${confidenceBadge(r.confidence)}</div>
  ${r.value?`<div class="rule-value">${esc(r.value)}${r.unit==="m"?" · minimum / maximum selon le texte":""}</div>`:"<div class=\"rule-value\">Règle à déterminer</div>"}
  ${meta.length?`<div class="chips">${meta.join("")}</div>`:""}
  <div class="rule-detail"><b>Règle identifiée :</b> ${esc(r.raw||r.title)}</div>
  <div class="rule-detail"><b>Conséquence pour le projet :</b> ${esc(r.why)}</div>
  <div class="source"><b>Source :</b> code CNIG ${esc(r.src.code)}${r.src.file?" · "+esc(r.src.file):""}</div>
  ${evidenceCard(r)}
  <details><summary>Voir les données utilisées par le moteur</summary><div class="source">${r.attrs.length?r.attrs.map(a=>`${esc(a.a)} = ${esc(a.v)}`).join(" · "):"Aucun attribut structuré fourni."}</div><div class="source">${esc(JSON.stringify(r.raw))}</div></details>
 </div>`;
}
function prescriptionCards(fc, parcelLabels=[]){
 const rules=(fc?.features||[]).map(f=>ruleFromFeature(f,parcelLabels));
 const map=new Map();
 for(const r of rules){if(!map.has(r.key))map.set(r.key,r)}
 const order=["implantation","emprise","hauteur","espaces","stationnement","aspect","acces","clotures","autres"];
 const uniq=[...map.values()];
 const summary=order.flatMap(cat=>uniq.filter(r=>r.category===cat)).map(ruleCard).join("");
 return summary || `<div class="item"><span class="small">Aucune prescription surfacique retournée.</span></div>`;
}

function engineSummary(rules){
 const cert=rules.filter(r=>r.confidence==="CERTIFIÉ").length;
 const confirm=rules.filter(r=>r.confidence==="À CONFIRMER").length;
 const unknown=rules.filter(r=>r.confidence==="NON DÉTERMINÉ").length;
 return `<div class="stat"><div><span class="small">Règles certifiées</span><b>${cert}</b></div><div><span class="small">À confirmer</span><b>${confirm}</b></div></div>${unknown?`<div class="error" style="margin-top:10px">🔴 ${unknown} règle(s) non déterminée(s) automatiquement.</div>`:""}`;
}


async function officialDocumentsForPartition(partition){
  if(!partition)return [];
  const url="https://www.geoportail-urbanisme.gouv.fr/api/document?partition="+encodeURIComponent(partition)+"&legalStatus=APPROVED&limit=100";
  try{
    const j=await json(url);
    return Array.isArray(j)?j:[];
  }catch(e){return []}
}
function bestOfficialDocument(docs){
  return [...docs].sort((a,b)=>{
    const da=String(a.originalName||"").slice(-8), db=String(b.originalName||"").slice(-8);
    return db.localeCompare(da);
  })[0]||null;
}
async function officialDocumentPanel(zoneFC){
  const f=zoneFC?.features?.[0], p=f?.properties||{};
  const partition=p.partition||null, idurba=p.idurba||p.IDURBA||null;
  if(!partition && !idurba){
    return `<div class="regbox"><div class="regtitle">🔴 Document opposable non identifié</div><div class="small">Le moteur refuse d'attribuer un règlement sans identifiant documentaire fiable.</div></div>`;
  }
  const docs=await officialDocumentsForPartition(partition);
  let doc=docs.find(d=>d.originalName===idurba)||docs.find(d=>d.id===idurba)||bestOfficialDocument(docs);
  if(!doc){
    return `<div class="regbox"><div class="regtitle">🟡 Document à confirmer</div><div class="small">Identifiant : ${esc(idurba||"—")} · Partition : ${esc(partition||"—")}</div><a href="https://www.geoportail-urbanisme.gouv.fr/" target="_blank">Vérifier sur le GPU ↗</a></div>`;
  }
  const detailUrl="https://www.geoportail-urbanisme.gouv.fr/api/document/"+encodeURIComponent(doc.id)+"/details";
  let detail=null;
  try{detail=await json(detailUrl)}catch(e){}
  const files=detail?.writingMaterials||detail?.files||{};
  const names=Object.keys(files);
  const reg=names.find(n=>/reglement.*\.pdf$/i.test(n))||names.find(n=>/reglement/i.test(n)&&/\.pdf$/i.test(n));
  const regUrl=reg?files[reg]:null;
  return `<div class="regbox">
    <div class="regtitle">🟢 Document réglementaire identifié</div>
    <div class="rule-detail"><b>${esc(doc.title||doc.originalName||"PLU/PLUi")}</b></div>
    <div class="source">Identifiant : ${esc(doc.originalName||doc.id||"—")}</div>
    <div class="source">Statut légal : ${esc(doc.legalStatus||"APPROVED")}</div>
    <div class="source">Partition : ${esc(partition||"—")}</div>
    <div class="source">Version publiée : ${esc(doc.version||"—")}</div>
    ${regUrl?`<p><a href="${esc(regUrl)}" target="_blank">📄 Ouvrir le règlement officiel ↗</a></p>`:`<p><a href="${detailUrl}" target="_blank">Voir les pièces écrites officielles ↗</a></p>`}
    <div class="small">Le moteur ne considère ce document comme source que parce qu'il est identifié par l'API officielle du GPU avec un statut approuvé.</div>
  </div>`;
}


function allCoords(f){
 const pts=[]; function walk(x){if(Array.isArray(x)&&typeof x[0]==="number")pts.push(x);else if(Array.isArray(x))x.forEach(walk)} walk(f.geometry.coordinates); return pts;
}
function geomMetrics(site){
 const pts=allCoords(site);
 if(!pts.length)return null;
 const lons=pts.map(p=>p[0]), lats=pts.map(p=>p[1]);
 const minLon=Math.min(...lons),maxLon=Math.max(...lons),minLat=Math.min(...lats),maxLat=Math.max(...lats);
 const midLat=(minLat+maxLat)/2, mPerLon=111320*Math.cos(midLat*Math.PI/180), mPerLat=110540;
 return {
  width:(maxLon-minLon)*mPerLon,
  depth:(maxLat-minLat)*mPerLat,
  minLon,maxLon,minLat,maxLat
 };
}
function projectGeometrySummary(site,selected){
 const m=geomMetrics(site), total=selected.reduce((s,f)=>s+area(f),0);
 if(!m)return {total,width:null,depth:null};
 return {total,width:m.width,depth:m.depth};
}
function orientationLabel(site){
 const pts=allCoords(site); if(pts.length<2)return "non déterminée";
 const m=geomMetrics(site); if(!m)return "non déterminée";
 return m.width>=m.depth?"emprise plus large que profonde":"emprise plus profonde que large";
}

function numericValue(v){
 const m=String(v??"").replace(",",".").match(/-?\d+(?:\.\d+)?/); return m?Number(m[0]):null;
}
function resolveRule(r){
 const resolved={...r,answer:null,answerType:"unknown",missing:[]};
 const rawN=normText(r.raw);
 if(r.value){
   resolved.answer=r.value;
   resolved.answerType=(r.category==="implantation" && r.boundary)?"resolved":"value_found";
 }
 if(r.category==="implantation"){
   if(!r.boundary)resolved.missing.push("limite de référence");
   if(!r.value)resolved.missing.push("distance de retrait");
   if(/vue|baie|fenetre|jour|aveugle/.test(rawN) && !r.condition)resolved.missing.push("condition liée aux ouvertures");
   if(r.boundary && r.value)resolved.answerType="resolved";
 } else if(r.category==="emprise" && r.value){
   resolved.answerType="resolved";
 } else if(r.category==="hauteur" && r.value){
   resolved.answerType="value_found";
   resolved.missing.push("mode exact de mesure");
 } else if(r.category==="espaces" && r.value){
   resolved.answerType="value_found";
   resolved.missing.push("définition des surfaces admissibles");
 } else if(r.category==="stationnement"){
   resolved.missing.push("destination et unité de calcul");
 }
 return resolved;
}
function confidenceLabel(r){
 const x=resolveRule(r);
 if(x.answerType==="resolved")return {label:"🟢 Règle résolue",cls:"ok",x};
 if(x.answerType==="value_found")return {label:"🟡 Valeur trouvée — contexte restant",cls:"warn",x};
 return {label:"🔴 Règle non résolue",cls:"danger",x};
}
function resolvedRuleCard(r){
 const c=confidenceLabel(r),x=c.x;
 const context=x.missing.length?`<div class="missing"><b>Contexte restant :</b> ${x.missing.map(esc).join(" · ")}</div>`:"";
 const chips=[];
 if(r.boundary)chips.push(`<span class="mini">📍 ${esc(r.boundary)}</span>`);
 if(r.qualifier)chips.push(`<span class="mini">↕ ${esc(r.qualifier)}</span>`);
 if(r.condition)chips.push(`<span class="mini">👁 ${esc(r.condition)}</span>`);
 return `<div class="rule">
   <div class="rule-head"><div class="rule-title">${r.icon} ${esc(r.subject)}</div><span class="badge ${c.cls}">${c.label}</span></div>
   ${x.answer?`<div class="rule-value">${esc(x.answer)}${r.qualifier?" · "+esc(r.qualifier):""}</div>`:"<div class=\"rule-value\">Aucune valeur chiffrée</div>"}
   ${chips.length?`<div class="chips">${chips.join("")}</div>`:""}
   <div class="rule-detail"><b>Prescription :</b> ${esc(r.raw||r.title)}</div>
   <div class="rule-detail"><b>Portée :</b> ${esc(r.applicability)}</div>
   ${context}
   <div class="source"><b>CNIG :</b> ${esc(r.code)}${r.src.file?" · "+esc(r.src.file):""}</div>
   ${r.src.url?`<div class="source"><a href="${esc(r.src.url)}" target="_blank">Ouvrir la pièce source ↗</a></div>`:""}
   <details><summary>Preuve / attributs</summary><div class="source">${r.attrs.length?r.attrs.map(a=>`${esc(a.a)} = ${esc(a.v)}`).join(" · "):"Aucun attribut structuré."}</div><div class="source">${esc(r.raw)}</div></details>
 </div>`;
}
function resolvedPrescriptionCards(fc, parcelLabels=[]){
 const raw=(fc?.features||[]).map(f=>ruleFromFeature(f,parcelLabels));
 const specific15=new Set(raw.map(r=>r.code).filter(c=>["15-01","15-02","15-03","15-98"].includes(c)));
 const filtered=raw.filter(r=>!(r.code==="15-00" && specific15.size));
 const rules=[]; const seen=new Set();
 for(const r of filtered){
   const x=resolveRule(r),key=r.code+"|"+r.subject+"|"+x.answer+"|"+r.qualifier+"|"+r.condition;
   if(!seen.has(key)){seen.add(key);rules.push(r)}
 }
 const order=["implantation","emprise","hauteur","espaces","stationnement","aspect","acces","clotures","autres"];
 return order.flatMap(c=>rules.filter(r=>r.category===c)).map(resolvedRuleCard).join("")||`<div class="item">Aucune prescription exploitable.</div>`;
}
function resolutionSummary(fc,parcelLabels=[]){
 const rs=(fc?.features||[]).map(f=>resolveRule(ruleFromFeature(f,parcelLabels)));
 const resolved=rs.filter(r=>r.answerType==="resolved").length;
 const values=rs.filter(r=>r.answerType==="value_found").length;
 const unknown=rs.filter(r=>r.answerType==="unknown").length;
 return `<div class="metric">
  <div><span class="small">Règles résolues</span><b>${resolved}</b></div>
  <div><span class="small">Valeurs trouvées</span><b>${values}</b></div>
  <div><span class="small">Sans donnée suffisante</span><b>${unknown}</b></div>
 </div>`;
}

function architectureAlerts(zones,pres,sups,selected){
 const alerts=[];
 const zoneLabels=labels(zones);
 if(!zoneLabels.length)alerts.push({c:"orange",t:"Zonage non identifié automatiquement. Vérification manuelle nécessaire."});
 const rules=(pres?.features||[]).map(f=>ruleFromFeature(f,selected.map(parcelLabel)));
 const unresolved=rules.filter(r=>r.confidence!=="CERTIFIÉ");
 if(unresolved.length)alerts.push({c:"orange",t:`${unresolved.length} règle(s) nécessitent encore une vérification dans le règlement écrit.`});
 if((sups?.features||[]).length)alerts.push({c:"orange",t:`${sups.features.length} servitude(s) d’utilité publique détectée(s) : vérifier leur portée sur le projet.`});
 if(selected.length>1 && new Set(zoneLabels.map(normText)).size>1)alerts.push({c:"red",t:"Plusieurs zones ou secteurs semblent concernés : ne pas appliquer une règle unique à toutes les parcelles."});
 if(!alerts.length)alerts.push({c:"green",t:"Aucun point bloquant automatique identifié à ce stade. Cela ne constitue pas une validation réglementaire."});
 return alerts;
}
function architectureCard(site,selected,zones,pres,sups){
 const m=projectGeometrySummary(site,selected), alerts=architectureAlerts(zones,pres,sups,selected);
 const width=m.width?m.width.toFixed(1)+" m":"—",depth=m.depth?m.depth.toFixed(1)+" m":"—";
 const areaTxt=m.total?Math.round(m.total)+" m²":"—";
 const areaRatio=(m.width&&m.depth)?(m.width*m.depth).toFixed(0)+" m² (emprise rectangulaire indicative)":"—";
 return `<section class="card">
  <div class="title">🏗️ Lecture architecturale du terrain</div>
  <div class="small">Première lecture géométrique : ce module décrit la parcelle, mais ne fabrique pas une enveloppe constructible sans disposer des règles précises de retrait.</div>
  <div class="metric">
    <div><span class="small">Surface cadastrale</span><b>${areaTxt}</b></div>
    <div><span class="small">Largeur indicative</span><b>${width}</b></div>
    <div><span class="small">Profondeur indicative</span><b>${depth}</b></div>
  </div>
  <div class="item"><b>Configuration</b><br><span class="small">${esc(orientationLabel(site))}</span></div>
  <div class="item"><b>Emprise englobante indicative</b><br><span class="small">${esc(areaRatio)} — ce n’est pas une surface constructible.</span></div>
  <div class="diagram">
   <b>Ce que le moteur sait déjà</b>
   <div class="small">✓ limites géométriques de l’unité foncière<br>✓ surface cadastrale cumulée<br>✓ parcelles composant le projet<br>✓ zonage / prescriptions détectées</div>
   <br><b>Ce qu’il doit encore déterminer avant de dessiner une enveloppe</b>
   <div class="small">• façade(s) sur voie<br>• limites latérales / fond de parcelle selon la configuration urbaine<br>• retraits précis par côté<br>• règles liées aux vues / baies<br>• hauteur et mode de mesure<br>• exceptions et constructions existantes</div>
  </div>
  <div class="title" style="margin-top:14px">🎯 Niveau de précision</div><div class="small">Le moteur sépare maintenant la <b>valeur réellement trouvée</b> du <b>contexte encore manquant</b>. Une règle n’est plus entièrement « à confirmer » simplement parce qu’un détail secondaire manque.</div><div class="title" style="margin-top:14px">⚠️ Points d’attention</div>
  ${alerts.map(a=>`<div class="alertbox ${a.c}">${esc(a.t)}</div>`).join("")}
 </section>`;
}

async function analyzeSelected(){
 if(!state.selected.length){alert("Sélectionne au moins une parcelle.");return}
 document.getElementById("loading").style.display="block";
 try{
   const selected=state.selected.map(i=>state.candidates[i]),site=unionSelected();
   const [zones,pres,sups]=await Promise.all([gpu("zone-urba",site.geometry),gpu("prescription-surf",site.geometry),gpu("assiette-sup-s",site.geometry)]);
   renderAnalysis(selected,site,zones,pres,sups);
 }catch(e){document.getElementById("result").innerHTML=`<section class="card"><div class="error"><b>Analyse interrompue :</b> ${esc(e.message)}</div></section>`}
 finally{document.getElementById("loading").style.display="none"}
}

function renderAnalysis(selected,site,zones,pres,sups){
 const total=selected.reduce((s,f)=>s+area(f),0),zl=labels(zones),sl=labels(sups); const parcelLabels=selected.map(parcelLabel); const rules=(pres?.features||[]).map(f=>ruleFromFeature(f,parcelLabels));
 const rows=selected.map(f=>`<div class="item"><div class="row"><b>${esc(parcelLabel(f))}</b><span>${area(f)?Math.round(area(f))+" m²":"—"}</span></div></div>`).join("");
 document.getElementById("result").innerHTML=`<section class="card"><div class="row"><div><div class="small">Projet / unité foncière analysée</div><div class="title">${esc(state.addressFeature.properties.label||"Adresse")}</div></div>${badge("ok")}</div><div class="stat"><div><span class="small">Parcelles</span><b>${selected.length}</b></div><div><span class="small">Surface cumulée</span><b>${total?Math.round(total)+" m²":"—"}</b></div></div><div id="map"></div><div class="legend"><span>🟦 Parcelles sélectionnées</span><span>📍 Adresse</span></div><button class="secondary" onclick="showCandidates(state.addressFeature,state.candidates)">Modifier les parcelles</button></section>
<section class="card"><div class="title">Composition du terrain</div>${rows}</section>${architectureCard(site,selected,zones,pres,sups)}
<section class="card"><div class="title">Urbanisme — zone</div><div class="item"><div class="row"><b>Zonage</b>${zl.length?badge("ok"):badge("warn")}</div><div>${zl.length?zl.map(esc).join(" · "):"Aucun zonage retourné."}</div><div class="source">Source : API Carto / Géoportail de l’Urbanisme</div></div></section>
<section class="card"><div class="title">📐 Règles d’urbanisme identifiées</div><div class="small">La synthèse utilise les codes et attributs CNIG quand ils sont disponibles. Elle distingue la valeur, son caractère minimum/maximum, et la conséquence pratique pour le projet. Elle ne remplace pas le règlement opposable.</div>${prescriptionCards(pres)}</section>
<section class="card"><div class="title">📄 Règlement écrit — source</div>
<div class="small">La lecture automatique du PDF sera traitée dans une couche serveur dédiée. En attendant, ArchiTerrain ne bloque plus l’analyse si le PDF n’est pas directement lisible dans Safari.</div>
<div class="item"><b>Source officielle</b><br><a href="https://www.geoportail-urbanisme.gouv.fr/" target="_blank">Ouvrir le Géoportail de l’Urbanisme ↗</a></div>
<div class="item"><span class="small">Les prescriptions ci-dessus restent rattachées à leurs attributs CNIG et, lorsqu'il est fourni, à leur fichier source.</span></div>
</section>
<section class="card"><div class="title">Servitudes d’utilité publique</div><div class="item"><div class="row"><b>SUP surfaciques</b>${sl.length?badge("danger"):badge("ok")}</div><div>${sl.length?sl.map(esc).join(" · "):"Aucune SUP surfacique retournée."}</div></div></section>
<section class="card"><div class="title">Règle de prudence</div><div class="small">Les prescriptions sont classées par thème pour faciliter la lecture. Pour toute décision de projet, consulter le règlement et le document opposable correspondant.</div></section>
<section class="card"><div class="success">✅ ${selected.length} parcelle${selected.length>1?"s":" analysée"} avec une emprise cumulée.</div></section>`;
 buildMap(selected,site)
}

function buildMap(selected,site){
 if(state.map){state.map.remove();state.map=null}
 const map=L.map("map",{zoomControl:true,scrollWheelZoom:true});state.map=map;
 L.tileLayer("https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png",{maxZoom:20,attribution:"© OpenStreetMap contributors"}).addTo(map);
 selected.forEach(f=>L.geoJSON(f,{style:{color:"#2563eb",weight:3,fillColor:"#60a5fa",fillOpacity:.22}}).addTo(map).bindPopup(parcelLabel(f)));
 const u=L.geoJSON(site,{style:{color:"#111827",weight:4,fillOpacity:0}}).addTo(map);
 L.marker([state.addressFeature.geometry.coordinates[1],state.addressFeature.geometry.coordinates[0]]).addTo(map).bindPopup("Adresse");
 map.fitBounds(u.getBounds(),{padding:[30,30],maxZoom:18});setTimeout(()=>map.invalidateSize(),100);setTimeout(()=>map.invalidateSize(),500)
}
async function analyze(){
 const address=document.getElementById("address").value.trim(),refText=document.getElementById("parcelRef").value.trim();if(!address)return;
 document.getElementById("loading").style.display="block";document.getElementById("result").innerHTML="";
 try{const adr=(await geocode(address))[0],refs=refText?refText.split(",").map(x=>x.trim()).filter(Boolean):[],fs=await findCandidates(adr,refs);showCandidates(adr,fs);if(fs.length===1)await analyzeSelected()}
 catch(e){document.getElementById("result").innerHTML=`<section class="card"><div class="error"><b>Recherche interrompue :</b> ${esc(e.message)}</div></section>`}
 finally{document.getElementById("loading").style.display="none"}
}
</script>
