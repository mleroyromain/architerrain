<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#111827">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon.svg">
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
<title>ArchiTerrain V1.4</title>
<style>
:root{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;color:#111827;background:#f4f5f7}
*{box-sizing:border-box}body{margin:0}
header{padding:20px 18px;background:#111827;color:#fff}.brand{font-size:28px;font-weight:800}.sub{opacity:.75}
main{max-width:820px;margin:auto;padding:16px}.card{background:#fff;border-radius:18px;padding:18px;margin:14px 0;box-shadow:0 2px 12px #0001}
input,button{width:100%;padding:14px;border-radius:12px;font-size:16px;margin:7px 0}
input{border:1px solid #d1d5db;background:#fff}button{border:0;background:#111827;color:#fff;font-weight:700}
button.secondary{background:#e5e7eb;color:#111827}.small{font-size:13px;color:#6b7280}.title{font-weight:750}
.item{padding:14px 0;border-top:1px solid #eee}.row{display:flex;justify-content:space-between;gap:12px;align-items:center}
.badge{padding:6px 9px;border-radius:999px;font-size:12px;font-weight:700;white-space:nowrap}
.ok{background:#dcfce7;color:#166534}.warn{background:#fef3c7;color:#92400e}.danger{background:#fee2e2;color:#991b1b}
.error{background:#fee2e2;color:#991b1b;padding:12px;border-radius:12px}.success{background:#dcfce7;color:#166534;padding:12px;border-radius:12px}
#loading{display:none;text-align:center;padding:15px}#map{height:360px;width:100%;border-radius:14px;overflow:hidden;margin-top:14px}
.leaflet-container{font:inherit}.candidate{border:1px solid #e5e7eb;border-radius:12px;padding:12px;margin:8px 0}
.candidate.selected{border:2px solid #111827}.candidate button{margin-top:10px}
.legend{display:flex;gap:10px;flex-wrap:wrap;margin-top:10px}.legend span{font-size:12px}
a{color:#2563eb;text-decoration:none}
</style>
</head>
<body>
<header><div class="brand">ArchiTerrain</div><div class="sub">Pré-diagnostic urbanistique · V1.4</div></header>
<main>
<section class="card">
<div class="title">Analyser un terrain</div>
<div class="small">Adresse ou références cadastrales</div>
<input id="address" value="28 boulevard André, 93250 Villemomble" placeholder="Ex. 28 boulevard André, Villemomble">
<input id="parcelRef" placeholder="Optionnel : section + parcelle, ex. AQ 61">
<button onclick="analyze()">Rechercher le terrain</button>
<div id="loading">⏳ Recherche de l'adresse et des parcelles…</div>
</section>
<div id="result"></div>
</main>

<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script>
const CARTO="https://apicarto.ign.fr/api";
const BAN="https://api-adresse.data.gouv.fr/search/";
let current={addressFeature:null,candidates:[],selected:null,map:null};

async function json(url){
 const r=await fetch(url);
 if(!r.ok)throw new Error("Service indisponible ("+r.status+")");
 return r.json();
}
function esc(v){return String(v??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]))}
function badge(s){return `<span class="badge ${s}">${s==="ok"?"Vérifié":s==="danger"?"Contrainte":"À vérifier"}</span>`}
function pick(p,keys){for(const k of keys)if(p?.[k]!==undefined&&p[k]!==null&&p[k]!=="")return p[k];return null}
function labels(fc){return [...new Set((fc?.features||[]).map(f=>pick(f.properties,["libelle","libelle_zone","libelle_long","nom","nom_zone","typezone","libelle_acte","categorie","libelle_sup","id"])).filter(Boolean))]}
function coordsOf(f){
 let pts=[];function walk(x){if(typeof x[0]==="number")pts.push(x);else x.forEach(walk)}walk(f.geometry.coordinates);
 return pts.length?pts.reduce((a,p)=>[a[0]+p[0]/pts.length,a[1]+p[1]/pts.length],[0,0]):null;
}
function dist2(a,b){return (a[0]-b[0])**2+(a[1]-b[1])**2}
function bboxAround([lon,lat],d=.0005){return {type:"Polygon",coordinates:[[[lon-d,lat-d],[lon+d,lat-d],[lon+d,lat+d],[lon-d,lat+d],[lon-d,lat-d]]]}}
async function geocode(q){
 const j=await json(BAN+"?q="+encodeURIComponent(q)+"&limit=5");
 if(!j.features?.length)throw new Error("Adresse introuvable.");
 return j.features;
}
async function parcelQuery(geom){
 const u=CARTO+"/cadastre/parcelle?geom="+encodeURIComponent(JSON.stringify(geom))+"&source_ign=PCI";
 const j=await json(u);return j.features||[];
}
async function refQuery(insee,section,number){
 const qs=new URLSearchParams({code_insee:insee,section:section.toUpperCase(),numero:number.padStart(4,"0"),source_ign:"PCI"});
 const j=await json(CARTO+"/cadastre/parcelle?"+qs.toString());return j.features||[];
}
async function gpu(path,geom){
 const u=CARTO+"/gpu/"+path+"?geom="+encodeURIComponent(JSON.stringify(geom));
 try{return await json(u)}catch(e){return {features:[],error:e.message}}
}

async function findCandidates(adr,ref){
 const coords=adr.geometry.coordinates;
 if(ref){
   const m=ref.trim().match(/^([A-Za-z]{1,3})\s*(\d{1,4})$/);
   if(!m)throw new Error("Référence cadastrale invalide. Exemple : AQ 61.");
   const fs=await refQuery(adr.properties.citycode,m[1],m[2]);
   if(!fs.length)throw new Error(`Parcelle ${m[1].toUpperCase()} ${m[2]} introuvable dans la commune.`);
   return fs;
 }
 let fs=await parcelQuery({type:"Point",coordinates:coords});
 if(fs.length)return fs;
 fs=await parcelQuery(bboxAround(coords));
 if(!fs.length)throw new Error("Aucune parcelle trouvée autour de cette adresse.");
 const ranked=fs.map(f=>({f,c:coordsOf(f)})).filter(x=>x.c).sort((a,b)=>dist2(a.c,coords)-dist2(b.c,coords));
 return ranked.map(x=>x.f);
}

function showCandidates(adr,fs){
 current.addressFeature=adr;current.candidates=fs;current.selected=null;
 const list=fs.slice(0,8).map((f,i)=>{
   const p=f.properties||{},s=pick(p,["section","section_cadastrale"])||"—",n=pick(p,["numero","numero_parcelle"])||"—",a=pick(p,["contenance","surface"]);
   return `<div class="candidate"><div class="row"><div><b>${esc(s)} ${esc(n)}</b><div class="small">${a?Math.round(a)+" m²":"surface non fournie"}</div></div>${i===0?badge("ok"):badge("warn")}</div><button onclick="selectParcel(${i})">${i===0?"Sélectionner cette parcelle":"Sélectionner"}</button></div>`;
 }).join("");
 document.getElementById("result").innerHTML=`
 <section class="card">
   <div class="title">Parcelles trouvées</div>
   <p>${esc(adr.properties.label||"Adresse")}</p>
   <div class="small">L’adresse peut être géocodée sur la voirie. Choisis la parcelle correspondant à ton terrain avant de lancer le diagnostic réglementaire.</div>
   ${list}
 </section>`;
}
async function selectParcel(i){
 current.selected=current.candidates[i];
 renderSelected();
}
async function renderSelected(){
 const f=current.selected,p=f.properties||{},adr=current.addressFeature;
 const section=pick(p,["section","section_cadastrale"])||"—",number=pick(p,["numero","numero_parcelle"])||"—",area=pick(p,["contenance","surface"]);
 const [zones,pres,sups]=await Promise.all([gpu("zone-urba",f.geometry),gpu("prescription-surf",f.geometry),gpu("assiette-sup-s",f.geometry)]);
 const zl=labels(zones),pl=labels(pres),sl=labels(sups);
 document.getElementById("result").innerHTML=`
 <section class="card">
  <div class="row"><div><div class="small">Terrain sélectionné</div><div class="title">${esc(adr.properties.label||"Adresse")}</div></div>${badge("ok")}</div>
  <p><b>Parcelle :</b> ${esc(section)} ${esc(number)}</p><p><b>Surface :</b> ${area?Math.round(area)+" m²":"non fournie"}</p>
  <div id="map"></div>
  <div class="legend"><span>🟦 Parcelle sélectionnée</span><span>📍 Adresse</span></div>
  <button class="secondary" onclick="showCandidates(current.addressFeature,current.candidates)">Changer de parcelle</button>
 </section>
 <section class="card"><div class="title">Urbanisme — GPU</div>
  <div class="item"><div class="row"><b>Zonage</b>${zl.length?badge("ok"):badge("warn")}</div><div>${zl.length?zl.map(esc).join(" · "):"Aucun zonage retourné."}</div><div class="small">Source : API Carto / Géoportail de l’Urbanisme</div></div>
  <div class="item"><div class="row"><b>Prescriptions</b>${pl.length?badge("warn"):badge("ok")}</div><div>${pl.length?pl.map(esc).join(" · "):"Aucune prescription surfacique retournée."}</div><div class="small">Source : API Carto / Géoportail de l’Urbanisme</div></div>
 </section>
 <section class="card"><div class="title">Servitudes d’utilité publique</div>
  <div class="item"><div class="row"><b>SUP surfaciques</b>${sl.length?badge("danger"):badge("ok")}</div><div>${sl.length?sl.map(esc).join(" · "):"Aucune SUP surfacique retournée."}</div><div class="small">Source : API Carto / Géoportail de l’Urbanisme</div></div>
 </section>
 <section class="card"><div class="title">Étapes suivantes</div>
  <div class="item">🟠 <b>Géorisques / PPR</b><br><span class="small">Croisement parcellaire à brancher.</span></div>
  <div class="item">🟠 <b>ABF / patrimoine</b><br><span class="small">Croisement des périmètres à brancher.</span></div>
 </section>
 <section class="card"><div class="success">✅ Parcelle explicitement sélectionnée : toutes les analyses utilisent maintenant sa géométrie cadastrale.</div></section>`;
 buildMap(f,adr);
}
function buildMap(parcel,adr){
 if(current.map){current.map.remove();current.map=null}
 const center=coordsOf(parcel)||adr.geometry.coordinates;
 const map=L.map("map",{zoomControl:true,scrollWheelZoom:true,preferCanvas:true});
 current.map=map;
 L.tileLayer("https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png",{maxZoom:20,attribution:"© OpenStreetMap contributors"}).addTo(map);
 const parcelLayer=L.geoJSON(parcel,{style:{color:"#2563eb",weight:4,fillColor:"#60a5fa",fillOpacity:.35}}).addTo(map);
 L.marker([adr.geometry.coordinates[1],adr.geometry.coordinates[0]]).addTo(map).bindPopup("Adresse").openPopup();
 map.fitBounds(parcelLayer.getBounds(),{padding:[35,35],maxZoom:19});
 setTimeout(()=>map.invalidateSize(),100);
 setTimeout(()=>map.invalidateSize(),500);
}
async function analyze(){
 const address=document.getElementById("address").value.trim(),ref=document.getElementById("parcelRef").value.trim();
 if(!address)return;
 document.getElementById("loading").style.display="block";document.getElementById("result").innerHTML="";
 try{
  const adrs=await geocode(address);const adr=adrs[0];
  const fs=await findCandidates(adr,ref);
  showCandidates(adr,fs);
  if(fs.length===1)await selectParcel(0);
 }catch(e){
  document.getElementById("result").innerHTML=`<section class="card"><div class="error"><b>Analyse interrompue :</b> ${esc(e.message)}</div></section>`;
 }finally{document.getElementById("loading").style.display="none"}
}
</script>
</body>
</html>
