<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#111827">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon.svg">
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
<title>ArchiTerrain V1.6</title>
<style>
:root{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;color:#111827;background:#f4f5f7}
*{box-sizing:border-box}body{margin:0}header{padding:20px 18px;background:#111827;color:#fff}.brand{font-size:28px;font-weight:800}.sub{opacity:.75}
main{max-width:860px;margin:auto;padding:16px}.card{background:#fff;border-radius:18px;padding:18px;margin:14px 0;box-shadow:0 2px 12px #0001}
input,button{width:100%;padding:14px;border-radius:12px;font-size:16px;margin:7px 0}input{border:1px solid #d1d5db;background:#fff}
button{border:0;background:#111827;color:#fff;font-weight:700}button.secondary{background:#e5e7eb;color:#111827}
.small{font-size:13px;color:#6b7280}.title{font-weight:750}.item{padding:14px 0;border-top:1px solid #eee}
.row{display:flex;justify-content:space-between;gap:12px;align-items:center}.badge{padding:6px 9px;border-radius:999px;font-size:12px;font-weight:700;white-space:nowrap}
.ok{background:#dcfce7;color:#166534}.warn{background:#fef3c7;color:#92400e}.danger{background:#fee2e2;color:#991b1b}
.error{background:#fee2e2;color:#991b1b;padding:12px;border-radius:12px}.success{background:#dcfce7;color:#166534;padding:12px;border-radius:12px}
#loading{display:none;text-align:center;padding:15px}#map{height:360px;width:100%;border-radius:14px;overflow:hidden;margin-top:14px}
.leaflet-container{font:inherit}.parcelChoice{border:1px solid #e5e7eb;border-radius:12px;padding:12px;margin:8px 0}
.parcelChoice.selected{border:2px solid #2563eb;background:#eff6ff}.parcelChoice label{display:flex;gap:12px;align-items:flex-start}
.parcelChoice input[type=checkbox]{width:22px;height:22px;margin:2px 0;flex:none}
.legend{display:flex;gap:10px;flex-wrap:wrap;margin-top:10px}.legend span{font-size:12px}
.stat{display:grid;grid-template-columns:1fr 1fr;gap:10px}.stat>div{background:#f8fafc;border-radius:12px;padding:12px}.stat b{display:block;font-size:20px}
.rule{background:#f8fafc;border-radius:14px;padding:14px;margin:10px 0;border-left:4px solid #d1d5db}
.rule-head{display:flex;justify-content:space-between;gap:10px;align-items:flex-start}.rule-title{font-size:16px;font-weight:800}.rule-value{font-size:20px;font-weight:800;margin:7px 0}
.rule-detail{font-size:14px;line-height:1.45}.source{font-size:12px;color:#6b7280;margin-top:8px}
.regbox{background:#f8fafc;border-radius:14px;padding:14px;margin:10px 0;border:1px solid #e5e7eb}
.regtitle{font-weight:800;font-size:16px}.quote{font-size:14px;line-height:1.5;background:#fff;border-left:4px solid #9ca3af;padding:10px;margin-top:8px}
.page{font-size:12px;color:#6b7280}.loadingline{padding:12px 0;color:#4b5563}

details{margin-top:8px}summary{color:#2563eb;font-size:13px;cursor:pointer}
a{color:#2563eb;text-decoration:none}
</style>
</head>
<body>
<header><div class="brand">ArchiTerrain</div><div class="sub">Pré-diagnostic urbanistique · V1.8</div></header>
<main>
<section class="card">
<div class="title">Analyser un terrain</div>
<div class="small">Une adresse, une parcelle ou plusieurs parcelles</div>
<input id="address" value="28 boulevard André, 93250 Villemomble" placeholder="Ex. 28 boulevard André, Villemomble">
<input id="parcelRef" placeholder="Optionnel : AQ 61, AQ 62, AQ 63">
<button onclick="analyze()">Rechercher le terrain</button>
<div id="loading">⏳ Recherche des parcelles…</div>
</section>
<div id="result"></div>
</main>
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@turf/turf@7/turf.min.js"></script>
<script type="module">import * as pdfjsLib from "https://cdnjs.cloudflare.com/ajax/libs/pdf.js/4.4.168/pdf.min.mjs"; window.pdfjsLib=pdfjsLib; pdfjsLib.GlobalWorkerOptions.workerSrc="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/4.4.168/pdf.worker.min.mjs";</script>
<script>
const CARTO="https://apicarto.ign.fr/api", BAN="https://api-adresse.data.gouv.fr/search/";
let state={addressFeature:null,candidates:[],selected:[],map:null};

async function json(url){const r=await fetch(url);if(!r.ok)throw new Error("Service indisponible ("+r.status+")");return r.json()}
function esc(v){return String(v??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]))}
function badge(s){return `<span class="badge ${s}">${s==="ok"?"Vérifié":s==="danger"?"Contrainte":"À vérifier"}</span>`}
function pick(p,keys){for(const k of keys)if(p?.[k]!==undefined&&p[k]!==null&&p[k]!=="")return p[k];return null}
function parcelLabel(f){const p=f.properties||{};return `${pick(p,["section","section_cadastrale"])||"—"} ${String(pick(p,["numero","numero_parcelle"])||"—").replace(/^0+/,"")||"0"}`}
function area(f){const p=f.properties||{},n=pick(p,["contenance","surface"]);return n?Number(n):0}
function labels(fc){return [...new Set((fc?.features||[]).map(f=>pick(f.properties,["libelle","libelle_zone","libelle_long","nom","nom_zone","typezone","libelle_acte","categorie","libelle_sup","id"])).filter(Boolean))]}
function coordsOf(f){let pts=[];function walk(x){if(typeof x[0]==="number")pts.push(x);else x.forEach(walk)}walk(f.geometry.coordinates);return pts.length?pts.reduce((a,p)=>[a[0]+p[0]/pts.length,a[1]+p[1]/pts.length],[0,0]):null}
function dist2(a,b){return (a[0]-b[0])**2+(a[1]-b[1])**2}
function bboxAround([lon,lat],d=.0005){return {type:"Polygon",coordinates:[[[lon-d,lat-d],[lon+d,lat-d],[lon+d,lat+d],[lon-d,lat+d],[lon-d,lat-d]]]}}
async function geocode(q){const j=await json(BAN+"?q="+encodeURIComponent(q)+"&limit=5");if(!j.features?.length)throw new Error("Adresse introuvable.");return j.features}
async function parcelQuery(geom){const j=await json(CARTO+"/cadastre/parcelle?geom="+encodeURIComponent(JSON.stringify(geom))+"&source_ign=PCI");return j.features||[]}
async function refQuery(insee,section,number){const qs=new URLSearchParams({code_insee:insee,section:section.toUpperCase(),numero:number.padStart(4,"0"),source_ign:"PCI"});const j=await json(CARTO+"/cadastre/parcelle?"+qs);return j.features||[]}
async function gpu(path,geom){try{return await json(CARTO+"/gpu/"+path+"?geom="+encodeURIComponent(JSON.stringify(geom)))}catch(e){return {features:[],error:e.message}}}

async function findCandidates(adr,refs){
 const coords=adr.geometry.coordinates;
 if(refs.length){
   const found=[]; for(const ref of refs){const m=ref.trim().match(/^([A-Za-z]{1,3})\s*(\d{1,4})$/);if(!m)continue;found.push(...await refQuery(adr.properties.citycode,m[1],m[2]))}
   if(found.length)return found; throw new Error("Aucune des références cadastrales saisies n'a été trouvée dans la commune.");
 }
 let fs=await parcelQuery({type:"Point",coordinates:coords}); if(fs.length)return fs;
 fs=await parcelQuery(bboxAround(coords)); if(!fs.length)throw new Error("Aucune parcelle trouvée autour de cette adresse.");
 return fs.map(f=>({f,c:coordsOf(f)})).filter(x=>x.c).sort((a,b)=>dist2(a.c,coords)-dist2(b.c,coords)).map(x=>x.f);
}
function showCandidates(adr,fs){
 state.addressFeature=adr;state.candidates=fs;state.selected=fs.length===1?[0]:[];
 const choices=fs.slice(0,20).map((f,i)=>{const a=area(f),sel=state.selected.includes(i);return `<div class="parcelChoice ${sel?"selected":""}"><label><input type="checkbox" ${sel?"checked":""} onchange="toggleParcel(${i},this.checked)"><span><b>${esc(parcelLabel(f))}</b><br><span class="small">${a?Math.round(a)+" m²":"surface non fournie"} · parcelle cadastrale</span></span></label></div>`}).join("");
 document.getElementById("result").innerHTML=`<section class="card"><div class="title">Parcelles candidates</div><p>${esc(adr.properties.label||"Adresse")}</p><div class="small">Sélectionne une ou plusieurs parcelles appartenant au projet. Elles resteront détaillées individuellement dans le diagnostic.</div>${choices}<button onclick="analyzeSelected()">Analyser ${state.selected.length} parcelle${state.selected.length>1?"s":""}</button></section>`;
}
function toggleParcel(i,checked){if(checked&&!state.selected.includes(i))state.selected.push(i);if(!checked)state.selected=state.selected.filter(x=>x!==i);showCandidatesKeep()}
function showCandidatesKeep(){document.querySelectorAll('.parcelChoice input').forEach((b,i)=>b.checked=state.selected.includes(i));document.querySelectorAll('.parcelChoice').forEach((el,i)=>el.classList.toggle('selected',state.selected.includes(i)));const btn=document.querySelector('#result button');if(btn)btn.textContent=`Analyser ${state.selected.length} parcelle${state.selected.length>1?"s":""}`}
function unionSelected(){const fs=state.selected.map(i=>state.candidates[i]);if(fs.length===1)return fs[0];const u=turf.union(turf.featureCollection(fs));if(!u)throw new Error("Impossible de construire l'emprise cumulée.");return u}

function normText(s){return String(s||"").normalize("NFD").replace(/[\u0300-\u036f]/g,"").toLowerCase()}
function clean(v){return String(v??"").replace(/_/g," ").replace(/\s+/g," ").trim()}
function attrs(p){
 const out=[];
 for(let i=1;i<=5;i++){
   const a=p["lib_attr"+i],v=p["lib_val"+i];
   if(a&&v)out.push({a:clean(a),v:clean(v)});
 }
 return out;
}
function firstAttr(p,tests){
 const aa=attrs(p);
 for(const t of tests){const x=aa.find(o=>normText(o.a).includes(normText(t)));if(x)return x.v}
 return null;
}
function typeCode(p){return String(p.typepsc??"").padStart(2,"0")+"-"+String(p.stypepsc??"").padStart(2,"0")}
function codeRule(p){
 const code=typeCode(p), a=attrs(p), lib=clean(p.libelle), txt=clean(p.txt), nat=clean(p.nature);
 const get=(names)=>firstAttr(p,names);
 if(code==="38-01"||code==="38-02") return {
   category:"emprise",icon:"📐",title:"Emprise au sol",
   value:get(["COEF_EMPRISE_SOL_MIN","COEF_EMPRISE_SOL_MAX"])||txt||null,
   qualifier:code==="38-01"?"minimum":"maximum",
   detail:lib||"Règle d’emprise au sol",
   why:"Cette règle encadre la part de l’unité foncière pouvant être occupée par les constructions."
 };
 if(code.startsWith("39-")){
   const h=get(["HAUTEUR_METRES_MIN","HAUTEUR_METRES_MAX"]);
   const r=get(["HAUTEUR_RPLUS_ETAGES"]);
   return {category:"hauteur",icon:"↕️",title:"Hauteur",value:h||r||txt||null,qualifier:code==="39-01"?"minimum":code==="39-02"?"maximum":"",detail:lib||"Règle de hauteur",why:"Cette règle limite ou encadre la hauteur des constructions."};
 }
 if(code==="42-00"){
   return {category:"espaces",icon:"🌿",title:"Coefficient de biotope",value:get(["COEF_BIOTOPE_MIN","COEF_BIOTOPE_MAX","COEF2_BIOTOPE_MIN","COEF2_BIOTOPE_MAX"])||txt||null,qualifier:"",detail:lib||"Coefficient de biotope par surface",why:"Cette règle concerne la part de la parcelle devant contribuer aux fonctions écologiques du sol."};
 }
 if(code.startsWith("43-")){
   return {category:"espaces",icon:"🌿",title:"Espaces libres / plantations",value:get(["COEF","POURCENTAGE","SURFACE"])||txt||null,qualifier:"",detail:lib||nat||"Règle sur les espaces libres et plantations",why:"Cette règle concerne les espaces non bâtis, plantations ou aménagements végétalisés."};
 }
 if(code.startsWith("44-")){
   return {category:"stationnement",icon:"🚗",title:"Stationnement",value:get(["NOMBRE","PLACES","MIN","MAX"])||txt||null,qualifier:code==="44-01"?"minimum":code==="44-02"?"maximum":"",detail:lib||"Règle de stationnement",why:"Cette règle détermine les obligations ou limites de stationnement liées au projet."};
 }
 if(code.startsWith("15-")){
   return {category:"implantation",icon:"📍",title:"Implantation",value:get(["VALEUR_DE_RECUL","VALEUR DE RECUL","DISTANCE","RETRAIT"])||txt||null,qualifier:"",detail:lib||nat||"Règle d’implantation",why:"Cette règle encadre la position de la construction par rapport aux voies, emprises ou limites."};
 }
 if(code.startsWith("41-")){
   return {category:"aspect",icon:"🏠",title:"Aspect extérieur",value:null,qualifier:"",detail:lib||nat||"Règle d’aspect extérieur",why:"Cette règle porte sur l’apparence des constructions, façades, toitures ou clôtures."};
 }
 if(code.startsWith("47-")){
   return {category:"acces",icon:"🔌",title:"Desserte / réseaux",value:null,qualifier:"",detail:lib||nat||"Règle de desserte par les réseaux",why:"Cette règle concerne l’accès au terrain et/ou son raccordement aux réseaux."};
 }
 return null;
}
function fallbackRule(p){
 const text=[p.libelle,p.txt,p.nature].filter(Boolean).join(" · "),n=normText(text);
 let title="Autre prescription",category="autres",icon="📄";
 if(n.includes("emprise")){title="Emprise au sol";category="emprise";icon="📐"}
 else if(n.includes("hauteur")){title="Hauteur";category="hauteur";icon="↕️"}
 else if(n.includes("pleine terre")||n.includes("espace vert")||n.includes("vegetal")){title="Espaces verts / pleine terre";category="espaces";icon="🌿"}
 else if(n.includes("stationnement")){title="Stationnement";category="stationnement";icon="🚗"}
 else if(n.includes("implantation")||n.includes("alignement")||n.includes("retrait")){title="Implantation";category="implantation";icon="📍"}
 else if(n.includes("cloture")){title="Clôtures";category="clotures";icon="🧱"}
 return {category,icon,title,value:null,qualifier:"",detail:String(p.libelle||p.nature||p.txt||"Prescription réglementaire"),why:"Prescription identifiée dans le règlement graphique.",raw:p};
}
function ruleFromFeature(f){
 const p=f.properties||{},r=codeRule(p)||fallbackRule(p);
 return {...r,raw:p,code:typeCode(p),url:p.urlfic||p.URLFIC||null,file:p.nomfic||p.NOMFIC||null,attrs:attrs(p)};
}
function prescriptionCards(fc){
 const items=(fc?.features||[]).map(ruleFromFeature);
 const groups={};
 for(const x of items){if(!groups[x.category])groups[x.category]=[];if(!groups[x.category].some(y=>y.detail===x.detail&&y.value===x.value))groups[x.category].push(x)}
 const order=["implantation","emprise","hauteur","espaces","stationnement","aspect","acces","clotures","autres"];
 let html="";
 for(const cat of order){
   if(!groups[cat])continue;
   for(const x of groups[cat]){
     const val=x.value?`${esc(x.value)}${x.qualifier?" · "+esc(x.qualifier):""}`:"Règle qualitative";
     const source=x.url?`<a href="${esc(x.url)}" target="_blank">Ouvrir la pièce écrite ↗</a>`:"Pièce écrite non fournie dans la donnée";
     const attrsText=x.attrs.length?x.attrs.map(o=>`${esc(o.a)} = ${esc(o.v)}`).join(" · "):"Attributs détaillés non fournis";
     html+=`<div class="rule">
       <div class="rule-head"><div class="rule-title">${x.icon} ${esc(x.title)}</div>${badge("warn")}</div>
       <div class="rule-value">${val}</div>
       <div class="rule-detail"><b>À retenir :</b> ${esc(x.detail)}</div>
       <div class="rule-detail"><b>Conséquence projet :</b> ${esc(x.why)}</div>
       <div class="source"><b>Code CNIG :</b> ${esc(x.code)}</div>
       <div class="source">${source}</div>
       <details><summary>Voir les données réglementaires structurées</summary><div class="source">${attrsText}</div><div class="source">${esc(JSON.stringify(x.raw))}</div></details>
     </div>`;
   }
 }
 return html||`<div class="item"><span class="small">Aucune prescription surfacique retournée par l’interrogation GPU.</span></div>`;
}


let regulationCache={};

function documentPartitionFrom(features){
  for(const f of (features?.features||[])){
    const p=f.properties||{};
    if(p.partition)return p.partition;
    if(p.idurba)return p.idurba;
  }
  return null;
}
async function gpuDocumentList(partition){
  if(!partition)return [];
  const u="https://www.geoportail-urbanisme.gouv.fr/api/document?partition="+encodeURIComponent(partition)+"&legalStatus=APPROVED&limit=50";
  const j=await json(u); return Array.isArray(j)?j:[];
}
function docDate(d){
  const s=String(d?.originalName||"");
  const m=s.match(/_(\d{8})$/); return m?m[1]:"00000000";
}
function chooseDocument(docs, idurba){
  if(idurba){
    const exact=docs.find(d=>d.originalName===idurba);
    if(exact)return exact;
  }
  return [...docs].sort((a,b)=>docDate(b).localeCompare(docDate(a)))[0]||null;
}
async function documentDetails(id){
  if(!id)return null;
  if(regulationCache[id])return regulationCache[id];
  const d=await json("https://www.geoportail-urbanisme.gouv.fr/api/document/"+encodeURIComponent(id)+"/details");
  regulationCache[id]=d; return d;
}
function pickRegFile(d){
  const wm=d?.writingMaterials||{};
  const names=Object.keys(wm);
  return names.find(n=>/reglement.*\.pdf$/i.test(n) && !/graphique/i.test(n))
      || names.find(n=>/reglement/i.test(n)&&/\.pdf$/i.test(n))
      || null;
}
function extractWindows(text, terms){
  const cleanText=text.replace(/\s+/g," ").trim();
  const out=[];
  for(const term of terms){
    const re=new RegExp(term.replace(/[.*+?^${}()|[\]\\]/g,"\\$&"),"ig");
    let m;
    while((m=re.exec(cleanText)) && out.length<20){
      const a=Math.max(0,m.index-230),b=Math.min(cleanText.length,m.index+520);
      const snippet=cleanText.slice(a,b);
      if(!out.some(x=>x.snippet===snippet))out.push({term,snippet});
    }
  }
  return out;
}
async function extractRegulationText(url, zoneNames){
  const pdf=await window.pdfjsLib.getDocument({url,withCredentials:false}).promise;
  const pages=[];
  const terms=["emprise au sol","hauteur","implantation","retrait","alignement","pleine terre","espace vert","stationnement","accès","voirie","clôture","coefficient de biotope"];
  for(let i=1;i<=Math.min(pdf.numPages,120);i++){
    const page=await pdf.getPage(i),content=await page.getTextContent();
    const text=content.items.map(x=>x.str).join(" ");
    const hits=extractWindows(text,terms);
    if(hits.length)pages.push({page:i,text,hits});
  }
  // Prefer pages where a zone name occurs.
  const zn=(zoneNames||[]).map(normText).filter(Boolean);
  pages.sort((a,b)=>{
    const ah=zn.some(z=>normText(a.text).includes(z))?1:0;
    const bh=zn.some(z=>normText(b.text).includes(z))?1:0;
    return bh-ah || a.page-b.page;
  });
  return {numPages:pdf.numPages,pages:pages.slice(0,18)};
}
async function loadRegulation(zoneFC){
  const p=(zoneFC?.features?.[0]?.properties)||{};
  const partition=p.partition||null, idurba=p.idurba||p.IDURBA||null;
  if(!partition && !idurba)return {status:"missing"};
  try{
    let docs=await gpuDocumentList(partition);
    let doc=chooseDocument(docs,idurba);
    if(!doc && idurba){
      const all=await gpuDocumentList("DU_"+partition.replace(/^DU_/,""));
      doc=chooseDocument(all,idurba);
    }
    if(!doc)return {status:"nodoc",partition,idurba};
    const detail=await documentDetails(doc.id);
    const file=pickRegFile(detail);
    if(!file)return {status:"nofile",doc};
    const url=detail.writingMaterials[file];
    const zoneNames=labels(zoneFC);
    const text=await extractRegulationText(url,zoneNames);
    return {status:"ok",doc,detail,file,url,text,zoneNames};
  }catch(e){return {status:"error",message:e.message,partition,idurba}}
}
function regulationHTML(r){
 if(r.status==="missing")return `<div class="regbox"><div class="regtitle">📄 Règlement écrit</div><div class="small">La référence du document n'a pas été fournie par la couche de zonage.</div></div>`;
 if(r.status==="nodoc")return `<div class="regbox"><div class="regtitle">📄 Règlement écrit</div><div class="small">Document approuvé non retrouvé automatiquement pour cette partition.</div></div>`;
 if(r.status==="nofile")return `<div class="regbox"><div class="regtitle">📄 Règlement écrit</div><div class="small">Le document est identifié, mais sa pièce « règlement » n'est pas exposée dans les pièces écrites.</div></div>`;
 if(r.status==="error")return `<div class="regbox"><div class="regtitle">📄 Règlement écrit</div><div class="small">Lecture automatique indisponible : ${esc(r.message)}</div></div>`;
 const pages=r.text.pages||[];
 let excerpts="";
 for(const pg of pages.slice(0,10)){
   for(const h of pg.hits.slice(0,3)){
     excerpts+=`<div class="quote"><div class="page">Page ${pg.page} · terme repéré : ${esc(h.term)}</div>${esc(h.snippet)}</div>`;
   }
 }
 return `<div class="regbox">
   <div class="regtitle">📄 Règlement écrit applicable</div>
   <div class="small">${esc(r.doc.title||r.doc.originalName||"Document d’urbanisme")} · ${esc(r.doc.legalStatus||"")}</div>
   <p><a href="${esc(r.url)}" target="_blank">Ouvrir le règlement PDF complet ↗</a></p>
   <div class="small">ArchiTerrain a recherché automatiquement les passages relatifs aux principales règles architecturales. Les extraits sont des repères de lecture, pas une interprétation juridique.</div>
   ${excerpts||'<div class="small">Aucun extrait pertinent n’a été retrouvé automatiquement dans les premières pages analysées.</div>'}
   <details><summary>Informations du document</summary><div class="source">Document : ${esc(r.doc.originalName||"—")} · Fichier : ${esc(r.file)}</div></details>
 </div>`;
}

async function analyzeSelected(){
 if(!state.selected.length){alert("Sélectionne au moins une parcelle.");return}
 document.getElementById("loading").style.display="block";
 try{
   const selected=state.selected.map(i=>state.candidates[i]),site=unionSelected();
   const [zones,pres,sups]=await Promise.all([gpu("zone-urba",site.geometry),gpu("prescription-surf",site.geometry),gpu("assiette-sup-s",site.geometry)]);
   renderAnalysis(selected,site,zones,pres,sups);
 }catch(e){document.getElementById("result").innerHTML=`<section class="card"><div class="error"><b>Analyse interrompue :</b> ${esc(e.message)}</div></section>`}
 finally{document.getElementById("loading").style.display="none"}
}

async function renderAnalysis(selected,site,zones,pres,sups){
 const total=selected.reduce((s,f)=>s+area(f),0),zl=labels(zones),sl=labels(sups); const regulation=await loadRegulation(zones);
 const regulationBlock=regulationHTML(regulation); const rows=selected.map(f=>`<div class="item"><div class="row"><b>${esc(parcelLabel(f))}</b><span>${area(f)?Math.round(area(f))+" m²":"—"}</span></div></div>`).join("");
 document.getElementById("result").innerHTML=`<section class="card"><div class="row"><div><div class="small">Projet / unité foncière analysée</div><div class="title">${esc(state.addressFeature.properties.label||"Adresse")}</div></div>${badge("ok")}</div><div class="stat"><div><span class="small">Parcelles</span><b>${selected.length}</b></div><div><span class="small">Surface cumulée</span><b>${total?Math.round(total)+" m²":"—"}</b></div></div><div id="map"></div><div class="legend"><span>🟦 Parcelles sélectionnées</span><span>📍 Adresse</span></div><button class="secondary" onclick="showCandidates(state.addressFeature,state.candidates)">Modifier les parcelles</button></section>
<section class="card"><div class="title">Composition du terrain</div>${rows}</section>
<section class="card"><div class="title">Urbanisme — zone</div><div class="item"><div class="row"><b>Zonage</b>${zl.length?badge("ok"):badge("warn")}</div><div>${zl.length?zl.map(esc).join(" · "):"Aucun zonage retourné."}</div><div class="source">Source : API Carto / Géoportail de l’Urbanisme</div></div></section>
<section class="card"><div class="title">📄 Règlement écrit et extraits utiles</div><div class="small">Cette section relie le zonage à la pièce écrite officielle lorsque le GPU permet de l’identifier.</div>${regulationBlock}</section>
<section class="card"><div class="title">📐 Règles d’urbanisme identifiées</div><div class="small">La synthèse utilise les données CNIG et, lorsque possible, les passages du règlement écrit officiel. Elle distingue les données structurées, les extraits sources et les conséquences pratiques. Elle ne remplace pas le règlement opposable.</div>${prescriptionCards(pres)}</section>
<section class="card"><div class="title">Servitudes d’utilité publique</div><div class="item"><div class="row"><b>SUP surfaciques</b>${sl.length?badge("danger"):badge("ok")}</div><div>${sl.length?sl.map(esc).join(" · "):"Aucune SUP surfacique retournée."}</div></div></section>
<section class="card"><div class="title">Règle de prudence</div><div class="small">Les prescriptions sont classées par thème pour faciliter la lecture. Pour toute décision de projet, consulter le règlement et le document opposable correspondant.</div></section>
<section class="card"><div class="success">✅ ${selected.length} parcelle${selected.length>1?"s":" analysée"} avec une emprise cumulée.</div></section>`;
 buildMap(selected,site)
}

function buildMap(selected,site){
 if(state.map){state.map.remove();state.map=null}
 const map=L.map("map",{zoomControl:true,scrollWheelZoom:true});state.map=map;
 L.tileLayer("https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png",{maxZoom:20,attribution:"© OpenStreetMap contributors"}).addTo(map);
 selected.forEach(f=>L.geoJSON(f,{style:{color:"#2563eb",weight:3,fillColor:"#60a5fa",fillOpacity:.22}}).addTo(map).bindPopup(parcelLabel(f)));
 const u=L.geoJSON(site,{style:{color:"#111827",weight:4,fillOpacity:0}}).addTo(map);
 L.marker([state.addressFeature.geometry.coordinates[1],state.addressFeature.geometry.coordinates[0]]).addTo(map).bindPopup("Adresse");
 map.fitBounds(u.getBounds(),{padding:[30,30],maxZoom:18});setTimeout(()=>map.invalidateSize(),100);setTimeout(()=>map.invalidateSize(),500)
}
async function analyze(){
 const address=document.getElementById("address").value.trim(),refText=document.getElementById("parcelRef").value.trim();if(!address)return;
 document.getElementById("loading").style.display="block";document.getElementById("result").innerHTML="";
 try{const adr=(await geocode(address))[0],refs=refText?refText.split(",").map(x=>x.trim()).filter(Boolean):[],fs=await findCandidates(adr,refs);showCandidates(adr,fs);if(fs.length===1)await analyzeSelected()}
 catch(e){document.getElementById("result").innerHTML=`<section class="card"><div class="error"><b>Recherche interrompue :</b> ${esc(e.message)}</div></section>`}
 finally{document.getElementById("loading").style.display="none"}
}
</script>
